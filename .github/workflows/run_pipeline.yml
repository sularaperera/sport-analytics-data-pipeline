name: Sport analytics pipeline
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch:       # "Run workflow" button for manual runs/testing


concurrency:
  group: sport-pipeline
  cancel-in-progress: false


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install ODBC Driver 18 for SQL Server
        run: |
          if odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            echo "Driver already installed"
          else
            curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --no-install-project

      - name: Run pipeline
        working-directory: src/1_sport_analytics_data_pipeline_v1
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          AZURE_SQL_DRIVER: ODBC Driver 18 for SQL Server
        run: uv run --no-project python run_pipeline.py
